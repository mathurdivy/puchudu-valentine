<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puchudu Valentine ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.pulse {
    animation: heartbeat 1.2s infinite;
    display: inline-block;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(0.95); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
}
.container {
    background: white;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
    width: 92%;
    max-width: 380px;
}

.bg-love-text {
   position: fixed;
    font-size: 56px;
    font-family: cursive;
    color: white;
    opacity: 0.18;

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    white-space: nowrap;
    pointer-events: none;

    z-index: 1;          /* important */
    display: none;
}

.heart {
    position: fixed;
    top: -20px;
    font-size: 20px;
    animation: fall linear forwards;
    pointer-events: none;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}

h1 { color: #e91e63; margin-bottom: 10px; }
h2 { margin-top: 0; }

button {
    padding: 14px 18px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin: 10px;
    width: 120px;
}

#yesBtn {
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    background-color: #f44336;
    color: white;
    position: absolute;
}

.screen { display: none; }

img {
    width: 90%;
    max-width: 260px;
    border-radius: 14px;
    margin-top: 15px;
}
.small {
    font-size: 13px;
    opacity: 0.8;
}
</style>
</head>

<body>
    
<div id="bgLove" class="bg-love-text">Divya Ka Divy</div>
    
<!-- music -->
<audio id="music" loop>
 <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- SCREEN 1 -->
<div class="container screen" id="screen1" style="display:block">
    <h1 class="pulse">Puchudu ❤️</h1>
    <h2>Will you be my Valentine?</h2>

    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 😏</button>
</div>

<!-- SCREEN 2 -->
<div class="container screen" id="screen2">
    <h1>Correct Answer Detected ✅</h1>
    <p>Scanning heart… please wait 😌</p>
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
</div>

<!-- SCREEN 3 -->
<div class="container screen" id="screen3">
    <h1>Compatibility: 1000% 💘</h1>
    <p>Puchudu = Permanently Assigned</p>
    <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
</div>

<!-- SCREEN 4 -->
<div class="container screen" id="screen4">
    <div id="hearts"></div>

    <h1 class="pulse">Happy Valentine’s Day 💖</h1>
    <h2 class="pulse">Puchudu ❤️</h2>
    <p>You are officially stuck with me now 😄</p>
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
    <p class="small">No escape. Only love.</p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const container = document.getElementById("screen1");

function moveNoButton() {
    const rect = container.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;

    const x = Math.random() * (rect.width - btnW - 20);
    const y = Math.random() * (rect.height - btnH - 20);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// Desktop hover
noBtn.addEventListener("mouseover", moveNoButton);

// Mobile touch
noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveNoButton();
});

// YES click
yesBtn.onclick = startSequence;

function startSequence() {
    // start music after user tap
    const music = document.getElementById("music");

    music.currentTime = 0;
    music.volume = 0.7;

    const playPromise = music.play();

    if (playPromise !== undefined) {
        playPromise.then(() => {
            console.log("Music started");
        }).catch(error => {
            alert("Tap Yes again — browser blocked first play");
        });
    }

    show("screen2");
    setTimeout(() => show("screen3"), 2200);
    setTimeout(() => {
    show("screen4");
    startHearts();
}, 4500);
}

function startHearts() {
    const heartsContainer = document.getElementById("hearts");

    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💗";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
}

function show(id) {

    document.querySelectorAll(".screen")
        .forEach(s => s.style.display = "none");

    document.getElementById(id).style.display = "block";

    const bg = document.getElementById("bgLove");
    bg.style.display = (id === "screen4") ? "block" : "none";
}
</script>

</body>
</html>
