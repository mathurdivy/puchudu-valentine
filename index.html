<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puchudu Valentine ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.container {
    background: white;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    position: relative;
    width: 92%;
    max-width: 380px;
}

h1 { color: #e91e63; margin-bottom: 10px; }
h2 { margin-top: 0; }

button {
    padding: 14px 18px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin: 10px;
    width: 120px;
}

#yesBtn {
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    background-color: #f44336;
    color: white;
    position: absolute;
}

.screen { display: none; }

img {
    width: 90%;
    max-width: 260px;
    border-radius: 14px;
    margin-top: 15px;
}
.small {
    font-size: 13px;
    opacity: 0.8;
}
</style>
</head>

<body>

<!-- music -->
<audio id="music" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a0a0f5b0.mp3?filename=romantic-love-ambient-11060.mp3" type="audio/mpeg">
</audio>

<!-- SCREEN 1 -->
<div class="container screen" id="screen1" style="display:block">
    <h1>Puchudu ❤️</h1>
    <h2>Will you be my Valentine?</h2>

    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 😏</button>
</div>

<!-- SCREEN 2 -->
<div class="container screen" id="screen2">
    <h1>Correct Answer Detected ✅</h1>
    <p>Scanning heart… please wait 😌</p>
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
</div>

<!-- SCREEN 3 -->
<div class="container screen" id="screen3">
    <h1>Compatibility: 1000% 💘</h1>
    <p>Puchudu = Permanently Assigned</p>
    <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
</div>

<!-- SCREEN 4 -->
<div class="container screen" id="screen4">
    <h1>Happy Valentine’s Day 💖</h1>
    <p>You are officially stuck with me now 😄</p>
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
    <p class="small">No escape. Only love.</p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const container = document.getElementById("screen1");

function moveNoButton() {
    const rect = container.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;

    const x = Math.random() * (rect.width - btnW - 20);
    const y = Math.random() * (rect.height - btnH - 20);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// Desktop hover
noBtn.addEventListener("mouseover", moveNoButton);

// Mobile touch
noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveNoButton();
});

// YES click
yesBtn.onclick = startSequence;

function startSequence() {
    // start music after user tap
    document.getElementById("music").play();

    show("screen2");
    setTimeout(() => show("screen3"), 2200);
    setTimeout(() => show("screen4"), 4500);
}

function show(id) {
    document.querySelectorAll(".screen")
        .forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";
}
</script>

</body>
</html>
